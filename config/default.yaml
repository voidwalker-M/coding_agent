llm:
  provider: openai # OpenAI-compatible backend (UF LiteLLM proxy)
  model: gpt-oss-120b
  api_key: ${GPT_OSS_API_KEY} # export GPT_OSS_API_KEY=your-key in the terminal (do not write keys in this file)
  base_url: https://api.ai.it.ufl.edu
  max_tokens: 8192

agent:
  max_steps: 40
  budget_tokens: 80000
  log_dir: ./logs

tools:
  shell:
    timeout: 30 # seconds
    max_output_tokens: 8000 # truncation length
  file:
    max_view_lines: 100 # lines shown per file_view call

context:
  repo_map_budget: 8000 # max tokens for repo-map
  history_window: 20 # number of most recent conversation rounds to retain
  compaction:
    enabled: false # LLM summarization when history exceeds trigger_tokens
    trigger_tokens: 24000 # compact when total history tokens exceed this
    keep_recent_messages: 8 # preserve the newest N messages verbatim
    min_messages_to_compact: 4 # need at least this many middle turns to compact

memory:
  enabled: false # persistent long-term memory across runs (--memory to enable on the CLI)
  dir: "" # empty → <repo>/.agent_memory ; sqlite memory.db + markdown cache live here
  top_k: 4 # number of long-term memories recalled and injected per task
  max_records: 500 # cap before consolidation evicts the weakest (recency/importance decayed)
  capture_episodes: true # store an episodic memory (task→outcome) at end of each run
  window_queries: 10 # short-term memory: last N user queries in the conversation
  default_user: default # actor id for CLI/single-user runs
  default_role: agent # guest | user | agent | admin — filters long-term recall
  auto_approve: true # false = Cursor-style pending memories until approve()
